# Workflow to run pull-requests specific checks.

name: PR
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Run source tests: author list, copyright notice and merge conflicts.
  source_checks:
    runs-on: [ubuntu-latest]
    steps:
    - name: Checkout the source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - name: Check source code
      run:
        ./ci/pull_request_checks.sh

  authors:
    runs-on: [ubuntu-latest]
    continue-on-error: true
    steps:
    - name: Checkout the source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - name: Check AUTHORS file
      run:
        ./ci/author_check.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt


      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        features: [all, none]
        os: [ubuntu-24.04-arm, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          prefix-key: ${{ matrix.os }}-clippy-${{ matrix.features }}


      - name: Clippy with all features
        if: ${{ matrix.features == 'all' }}
        run: cargo clippy --release --all-targets --all-features --tests --all -- -D warnings

      - name: Clippy with no features
        if: ${{ matrix.features == 'none' }}
        run: cargo clippy --release --all-targets --no-default-features --tests --all -- -D warnings

  encoder_guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          prefix-key: encoder-guardrails

      - name: Ensure encoder dependency graph is pure Rust
        run: ./tools/check_encoder_pure_rust.py --manifest-path jxl/Cargo.toml --package jxl --features encoder

      - name: Audit high-level encoder path for panic calls
        run: python3 tools/audit_encoder_panics.py

      - name: Run encoder bootstrap tests
        run: cargo test --release -p jxl --no-default-features --features encoder encode::

  encoder_rd_smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          prefix-key: encoder-rd-smoke

      - name: Build jxle
        run: cargo build --release --bin jxle

      - name: Setup python3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install numpy pillow

      - name: Generate tiny RGB test corpus
        run: |
          python3 - << 'PY'
          from PIL import Image
          import numpy as np

          def save(name, arr):
              Image.fromarray(arr.astype(np.uint8), 'RGB').save(f'/tmp/{name}.ppm')

          # gradient
          w,h=64,48
          grad=np.zeros((h,w,3),dtype=np.uint8)
          for y in range(h):
              for x in range(w):
                  grad[y,x,0]=(x*255)//(w-1)
                  grad[y,x,1]=(y*255)//(h-1)
                  grad[y,x,2]=((x+y)*255)//(w+h-2)
          save('rd_grad', grad)

          # checker
          chk=np.zeros((h,w,3),dtype=np.uint8)
          for y in range(h):
              for x in range(w):
                  c=255 if ((x//8+y//8)%2)==0 else 0
                  chk[y,x]=[c,c,c]
          save('rd_checker', chk)

          # flat logo-like blocks
          flat=np.zeros((h,w,3),dtype=np.uint8)
          flat[:,:w//2]=[0,180,255]
          flat[:,w//2:]=[255,255,255]
          flat[h//4:3*h//4,w//4:3*w//4]=[255,90,0]
          save('rd_flat', flat)

          # deterministic pseudo-noise
          noise=np.zeros((h,w,3),dtype=np.uint8)
          for y in range(h):
              for x in range(w):
                  noise[y,x,0]=(x*17+y*31)%256
                  noise[y,x,1]=(x*57+y*13)%256
                  noise[y,x,2]=(x*91+y*47)%256
          save('rd_noise', noise)
          PY

      - name: Differential encode/decode corpus smoke
        run: |
          python3 tools/differential_encode_decode.py /tmp/rd_grad.ppm /tmp/rd_checker.ppm /tmp/rd_flat.ppm /tmp/rd_noise.ppm --distance 1.0 --effort 7
          python3 tools/differential_encode_decode.py /tmp/rd_grad.ppm /tmp/rd_checker.ppm --distance 1.0 --effort 9 --progressive

      - name: Rate/distortion compare corpus
        run: |
          python3 tools/rate_distortion_compare.py /tmp/rd_grad.ppm /tmp/rd_checker.ppm /tmp/rd_flat.ppm /tmp/rd_noise.ppm --distance 1.0 --effort 7 > rd_compare.csv
          python3 tools/rd_dashboard.py rd_compare.csv rd_dashboard.html

      - name: Upload R/D artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: encoder_rd_smoke_artifacts
          path: |
            rd_compare.csv
            rd_dashboard.html

  encoder_simd_micro:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          prefix-key: encoder-simd-micro-${{ matrix.os }}

      - name: Run encoder SIMD microbench (auto)
        run: cargo bench -p jxl --bench encoder_simd_micro --features encoder -- --warm-up-time 0.1 --measurement-time 0.2

      - name: Summarize encoder SIMD microbench
        run: python3 tools/encoder_simd_bench_summary.py --out-csv encoder_simd_micro.csv --out-md encoder_simd_micro.md

      - name: Check SIMD benchmark thresholds (informational)
        run: python3 tools/check_encoder_simd_thresholds.py encoder_simd_micro.csv

      - name: Upload encoder SIMD microbench artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: encoder_simd_micro_artifacts_${{ matrix.os }}
          path: |
            encoder_simd_micro.csv
            encoder_simd_micro.md

  encoder_simd_equivalence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          prefix-key: encoder-simd-equivalence

      - name: Build jxle + decoder
        run: cargo build --release -p jxl_cli --bin jxle --bin jxl_cli

      - name: Scalar vs auto codestream equivalence corpus
        run: python3 tools/compare_encoder_scalar_auto_codestreams.py --jxle target/release/jxle --distance 1.0 --effort 7

      - name: Scalar vs assisted RD regression corpus
        run: python3 tools/check_encoder_simd_rd_regression.py --jxle target/release/jxle --jxl-decoder target/release/jxl_cli --distance 1.0 --effort 7

  encoder_simd_fuzz_smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.8.0
        with:
          prefix-key: encoder-simd-fuzz-smoke

      - name: Compile SIMD/scalar fuzz equivalence target
        run: cargo check --manifest-path jxl/fuzz/Cargo.toml --bin encode_simd_scalar_equiv_smoke

  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest]
        simd: [none]
        include:
          - os: ubuntu-latest
            simd: sse42
          - os: ubuntu-latest
            simd: avx
          - os: ubuntu-latest
            simd: avx512
          - os: ubuntu-24.04-arm
            simd: neon
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          prefix-key: ${{ matrix.os }}-test-${{ matrix.simd }}


      - name: Tests with SIMD feature ${{ matrix.simd }}
        if: ${{ matrix.simd != 'none' }}
        run: cargo test --release --all --no-fail-fast --no-default-features --features ${{ matrix.simd }}

      - name: Tests with no features
        if: ${{ matrix.simd == 'none' }}
        run: cargo test --release --all --no-fail-fast --no-default-features

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Install latest rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    - name: Rust cache
      uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3

    - name: Install llvm-cov
      run: cargo +stable install cargo-llvm-cov --locked

    - name: Build and gather coverage
      run: cargo llvm-cov --no-report --release

    - name: Generate JSON report
      run: cargo llvm-cov report --json --release --output-path=coverage.json

    - name: Distill summary
      run: ./ci/coverage_summary.py >> $GITHUB_STEP_SUMMARY

    - name: Generate HTML report
      run: cargo llvm-cov report --html --release --output-dir=coverage_html

    - name: Upload HTML report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage_report
        path: ./coverage_html/html

  conformance:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Checkout bench
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      with:
        repository: libjxl/bench
        path: bench      
        fetch-depth: 1
        persist-credentials: false

    - name: Fix bench dependencies
      run: |
        ( cd bench && git submodule update --recursive --init --depth 1 --recommend-shallow third_party/conformance )
        ( cd bench/third_party && rm -rf jxl-rs && ln -s "${GITHUB_WORKSPACE}" jxl-rs )

    - name: Cache conformance objects
      id: cache-conformance
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: bench/third_party/conformance/.objects
        key: conformance-objects

    - name: Update conformance objects
      run: bash bench/third_party/conformance/scripts/download_and_symlink_using_curl.sh

    - name: Install latest rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: clippy, rustfmt

    - name: Rust cache
      uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3

    - name: Build jxl_cli
      run: cargo build --release --bin jxl_cli

    - name: Setup python3
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.x'
    
    - name: Install Python dependencies
      run: pip install numpy apng pypng

    - name: Update apt
      run: sudo apt update

    - name: Install binary dependencies
      run: sudo apt install imagemagick

    - name: Run jxl-rs conformance tests with ICC
      id: icc_conformance
      run: python3 ./bench/third_party/conformance/scripts/conformance.py --decoder "python3 ${GITHUB_WORKSPACE}/bench/scripts/wrap_jxl-rs.py --decoder ' ${GITHUB_WORKSPACE}/bench/third_party/jxl-rs/target/release/jxl_cli %s %s --icc-out %s'" --corpus ${GITHUB_WORKSPACE}/bench/third_party/conformance/testcases/main_level5.txt --results=${GITHUB_WORKSPACE}/bench/docs/dumps/dump_jxl-rs.json --lax

    - name: Run jxl-rs conformance tests wrapped in PNG
      id: png_conformance
      run: python3 ./bench/third_party/conformance/scripts/conformance.py --decoder "python3 ${GITHUB_WORKSPACE}/bench/scripts/wrap_png.py --decoder ' ${GITHUB_WORKSPACE}/bench/third_party/jxl-rs/target/release/jxl_cli --override-bitdepth=16 %s %s '" --corpus ${GITHUB_WORKSPACE}/bench/third_party/conformance/testcases/main_level5.txt --results=${GITHUB_WORKSPACE}/bench/docs/dumps/dump_jxl-rs_via_png.json --lax
      continue-on-error: true

    - name: Export step summary
      run: ./ci/conformance_summary.py "${GITHUB_WORKSPACE}/bench/docs/dumps/dump_jxl-rs.json" "${GITHUB_WORKSPACE}/bench/docs/dumps/dump_jxl-rs_via_png.json" >> $GITHUB_STEP_SUMMARY

    - name: Merge conformance report HTML
      run: ./ci/merge_conformance_report.py "${GITHUB_WORKSPACE}/bench/docs" >> conformance_report.html

    - name: Upload HTML report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: conformance_report
        path: conformance_report.html

  benchmark:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Checkout the source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0  # Full history needed for jxl-perfhistory
        persist-credentials: false

    - name: Fetch base branch
      run: git fetch origin ${GITHUB_BASE_REF}

    - name: Install latest rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    - name: Rust cache
      uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
      with:
        prefix-key: benchmark

    - name: Install jxl-perfhistory
      run: cargo install --git https://github.com/zond/jxl-perfhistory

    - name: Select benchmark corpus
      id: select-images
      run: |
        mkdir -p testimages

        # Keep this aligned with the autoresearch image set so CI numbers stay
        # comparable while avoiding benchmark timeouts.
        cp jxl/resources/test/conformance_test_images/sunset_logo.jxl testimages/sunset_logo.jxl
        cp jxl/resources/test/conformance_test_images/bike.jxl testimages/bike.jxl
        cp jxl/resources/test/green_queen_modular_e3.jxl testimages/green_queen_modular_e3.jxl
        cp jxl/resources/test/green_queen_vardct_e3.jxl testimages/green_queen_vardct_e3.jxl
        cp jxl/resources/test/conformance_test_images/bicycles.jxl testimages/bicycles.jxl
        cp jxl/resources/test/conformance_test_images/delta_palette.jxl testimages/delta_palette.jxl
        cp jxl/resources/test/conformance_test_images/lz77_flower.jxl testimages/lz77_flower.jxl
        cp jxl/resources/test/conformance_test_images/patches.jxl testimages/patches_lossless.jxl

        echo "Selected $(find testimages -maxdepth 1 -name '*.jxl' | wc -l) images for benchmark"

    - name: Cache benchmark binaries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: benchmark-binaries
        key: ${{ runner.os }}-${{ runner.arch }}-benchmark-binaries

    - name: Run performance benchmark
      id: benchmark
      continue-on-error: true  # Never fail the PR
      run: |
        mkdir -p benchmark-binaries
        (jxl-perfhistory -b benchmark-binaries -g "testimages/*.jxl" -c 0.99 -e 0.03 --ignore-noisy-system --pr-comment || echo "Benchmark failed") > benchmark.txt

    - name: Save PR context
      run: |
        echo "${{ github.event.number }}" > pr_number.txt
        echo "${{ github.event.pull_request.head.sha }}" > head_sha.txt

    - name: Add to step summary
      if: always()
      run: |
        echo "## Performance Benchmark" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cat benchmark.txt >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: benchmark-results
        path: |
          benchmark.txt
          pr_number.txt
          head_sha.txt
